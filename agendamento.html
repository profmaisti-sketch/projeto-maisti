<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OficinaManager - Agendamentos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🔧 OficinaManager</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="agendamento.html">Agendamentos</a>
            <a href="pagamento.html">Pagamentos</a>
        </nav>
    </header>

    <main>
        <h2>Novo Agendamento</h2>
        <div class="card">
            <form id="form-agendamento">
                <div style="margin-bottom: 15px;">
                    <label>ID do Cliente (Simulado):</label><br>
                    <input type="number" id="id-cliente" required style="width: 100%; padding: 8px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Data do Serviço:</label><br>
                    <input type="date" id="data-servico" required style="width: 100%; padding: 8px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Serviço:</label><br>
                    <input type="text" id="servico" required style="width: 100%; padding: 8px;">
                </div>
                <button type="submit">Agendar</button>
            </form>
            <p id="msg-agendamento" style="color: green; margin-top: 10px; display: none;">Agendamento salvo!</p>
        </div>
    </main>

    <script src="js/mockData.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
